[package]
name = "llm-gate"
version = "0.1.0"
description = "A lightweight local AI gateway that securely proxies LLM API requests with automatic key injection and CORS support."
authors = ["xuanzhi33 <xuanzhi33@qq.com>"]
homepage = "https://github.com/xuanzhi33/LLM-Gate"
license = "AGPL-3.0-only"
repository = "https://github.com/xuanzhi33/LLM-Gate"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-fs = "2.5.1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
bytes = "1"
http-body-util = "0.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
